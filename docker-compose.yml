version: "3.9"
services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Python 3.13-slim
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DEBUG: "false"
      CORS_ORIGINS: "http://localhost:3000"
      WHISPER_MODEL_SIZE: tiny
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_MODEL_DIR: /app/models
    volumes:
      - whisper_models:/app/models # persist downloaded model across restarts
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  whisper_models:
